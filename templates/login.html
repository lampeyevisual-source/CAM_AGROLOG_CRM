
<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | CAM AGROLOG CRM</title>
<style>
body {
    font-family: Arial;
    background: #f2f4f2;
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
}
form {
    background: white;
    padding: 28px;
    border-radius: 10px;
    width: 300px;
}
input, button {
    box-sizing: border-box;
    width: 100%;
    padding: 12px;
    margin-top: 12px;
}
button {
    background: #176b3a;
    color: white;
    border: 0;
    border-radius: 5px;
    cursor: pointer;
}
.erro {
    color: #b00020;
}
</style>
</head>
<body>
<form action="{{ url_for('login') }}" method="POST">
<p>Informe sua senha de acesso.</p>
{% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
<input type="password" name="senha" placeholder="Senha de acesso" required autofocus>
<button type="submit">Entrar</button>
</form>
</body>
</html>
